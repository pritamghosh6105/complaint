services:
  # ==========================================
  # 1. PYTHON FASTAPI ML MICROSERVICE
  # ==========================================
  - type: web
    name: civicpulse-ml-service
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r ml-service/requirements.txt
    startCommand: uvicorn src.api.main:app --app-dir ml-service --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # ==========================================
  # 2. NODE.JS EXPRESS BACKEND API
  # ==========================================
  - type: web
    name: civicpulse-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd backend && npm install
    startCommand: node backend/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ML_SERVICE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ==========================================
  # 3. REACT VITE FRONTEND (STATIC SITE)
  # ==========================================
  - type: web
    name: civicpulse-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
